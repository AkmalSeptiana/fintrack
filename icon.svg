<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Outer Ring Accent -->
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="#10B981" stroke-width="4" stroke-opacity="0.25" />

  <!-- Main Chart & Wallet Combined Icon -->
  <g transform="translate(64, 64)" filter="url(#glow)">
    <!-- Wallet Base shape -->
    <path d="M48 96 C48 70 70 48 96 48 L288 48 C314 48 336 70 336 96 L336 288 C336 314 314 336 288 336 L96 336 C70 336 48 314 48 288 Z" fill="none" stroke="url(#iconGrad)" stroke-width="28" stroke-linejoin="round" />

    <!-- Ascending Financial Growth Line -->
    <path d="M96 256 L160 192 L224 224 L304 128" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Arrow Head -->
    <path d="M264 128 L304 128 L304 168" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Decorative Coin Circle -->
    <circle cx="288" cy="256" r="28" fill="url(#iconGrad)" />
  </g>
</svg>
